<section id="hero" class="bento" aria-labelledby="hero-title">
  <article class="tile intro">
    <p class="eyebrow">
      <span class="sr-only">{{ i18n.t('hero.eyebrow') }}</span>
      <span aria-hidden="true">{{ typedEyebrow() }}<span class="caret"></span></span>
    </p>
    <h1 id="hero-title">
      {{ i18n.t('hero.title') }}
      <span class="gradient-text highlight">{{ i18n.t('hero.titleHighlight') }}</span>
    </h1>
    <div class="actions">
      <a class="btn primary" href="#projetos">{{ i18n.t('hero.projects') }}</a>
      <a
        class="btn secondary icon-only"
        [href]="cvLink()"
        target="_blank"
        rel="noopener"
        [title]="i18n.t('hero.cv')"
        [attr.aria-label]="i18n.t('hero.cv')"
      >
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12" />
          <path d="m7 10 5 5 5-5" />
          <path d="M5 21h14" />
        </svg>
      </a>
      <a class="btn secondary" href="#contato">{{ i18n.t('nav.contact') }}</a>
    </div>
  </article>

  <figure class="tile photo">
    <picture>
      <source srcset="michel-profile.webp" type="image/webp" />
      <img src="michel-profile.jpg" [alt]="i18n.t('hero.photoAlt')" width="480" height="480" />
    </picture>
    <figcaption>
      <strong>Michel Alves</strong>
    </figcaption>
  </figure>
</section>
