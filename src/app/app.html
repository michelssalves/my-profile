<app-fx-background></app-fx-background>
<app-stack-bubbles></app-stack-bubbles>
<div class="scroll-progress" aria-hidden="true" [style.transform]="'scaleX(' + scrollProgress() + ')'"></div>

<a class="skip-link" href="#conteudo">{{ i18n.t('nav.skip') }}</a>

<header class="topbar">
  <a class="brand" href="#hero" aria-label="Michel Alves">
    <span class="brand-mark" aria-hidden="true">MA</span>
  </a>
  <span class="brand-name">Michel Alves</span>
  <div class="topbar-actions">
    <div class="lang-switch" role="group" [attr.aria-label]="i18n.t('hero.language')">
      @for (option of languages; track option.code) {
        <button
          type="button"
          (click)="i18n.setLanguage(option.code)"
          [class.active]="i18n.lang() === option.code"
          [attr.aria-pressed]="i18n.lang() === option.code"
          [attr.aria-label]="option.label"
          [title]="option.label"
        >
          <img [src]="option.flag" alt="" width="22" height="16" />
        </button>
      }
    </div>
    <button
      class="theme-toggle"
      type="button"
      [title]="themeLabel()"
      [attr.aria-label]="themeLabel()"
      (click)="toggleTheme()"
    >
      <span aria-hidden="true">{{ theme() === 'dark' ? '☀' : '☾' }}</span>
    </button>
  </div>
</header>

<main id="conteudo">
  <app-hero></app-hero>
  <app-destaque></app-destaque>
  <app-projetos></app-projetos>
  <app-sobre></app-sobre>
  <app-contato></app-contato>
</main>

<a
  class="whats-float"
  [class.hidden]="contactVisible()"
  [href]="whatsappLink()"
  target="_blank"
  rel="noopener"
  [title]="i18n.t('contact.whats')"
  [attr.aria-label]="i18n.t('contact.whats')"
>
  <img src="icons/whatsapp-white.svg" alt="" width="30" height="30" />
</a>
