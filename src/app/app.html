<app-fx-background></app-fx-background>
<div class="scroll-progress" aria-hidden="true" [style.transform]="'scaleX(' + scrollProgress() + ')'"></div>

<a class="skip-link" href="#conteudo">{{ i18n.t('nav.skip') }}</a>

<header class="topbar">
  <a class="brand" href="#hero">
    <span class="brand-mark" aria-hidden="true">MA</span>
    <span class="brand-text">
      <strong>Michel Alves</strong>
      <small>{{ i18n.t('brand.role') }}</small>
    </span>
  </a>
  <span class="status"><span class="status-dot" aria-hidden="true"></span>{{ i18n.t('hero.availableTitle') }}</span>
  <div class="topbar-actions">
    <div class="lang-switch" role="group" [attr.aria-label]="i18n.t('hero.language')">
      @for (option of languages; track option.code) {
        <button
          type="button"
          (click)="i18n.setLanguage(option.code)"
          [class.active]="i18n.lang() === option.code"
          [attr.aria-pressed]="i18n.lang() === option.code"
          [attr.aria-label]="option.label"
          [title]="option.label"
        >
          <img [src]="option.flag" alt="" width="22" height="16" />
        </button>
      }
    </div>
    <button
      class="theme-toggle"
      type="button"
      [title]="themeLabel()"
      [attr.aria-label]="themeLabel()"
      (click)="toggleTheme()"
    >
      <span aria-hidden="true">{{ theme() === 'dark' ? '☀' : '☾' }}</span>
    </button>
  </div>
</header>

<main id="conteudo">
  <app-hero></app-hero>
  <!-- Faixa da stack: duas linhas correndo em sentidos opostos, numa faixa levemente inclinada -->
  <div class="marquee" aria-hidden="true">
    @for (row of marqueeRows; track $index; let odd = $odd) {
      <div class="marquee-track" [class.reverse]="odd">
        @for (item of row; track $index) {
          <span class="marquee-item">
            <img [src]="item.icon" alt="" width="26" height="26" [class.invert-dark]="item.invertOnDark" />
            {{ item.name }}
          </span>
        }
      </div>
    }
  </div>
  <app-projetos></app-projetos>
  <app-sobre></app-sobre>
  <app-contato></app-contato>
</main>

<a
  class="whats-float"
  [class.hidden]="contactVisible()"
  [href]="whatsappLink()"
  target="_blank"
  rel="noopener"
  [title]="i18n.t('contact.whats')"
  [attr.aria-label]="i18n.t('contact.whats')"
>
  <img src="icons/whatsapp-white.svg" alt="" width="30" height="30" />
</a>
